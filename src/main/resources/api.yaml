openapi: 3.0.3

info:
  version: 1.0.0
  title: seaport.com

servers:
  - url: http://localhost:8081
    description: Local setup externally (outside of a cluster) [rootless]
  - url: http://localhost:8080/app
    description: Local setup internally (inside a cluster) [rootless]
  - url: http://localhost/app
    description: Local setup internally (inside a cluster)
  - url: http://localhost:8080
    description: Local setup externally (outside of a cluster)
paths:
  /v2/namespace/user:
    get:
      tags: [ namespace ]
      operationId: getNamespace
      description: Get the namespace for the authenticated
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'

  /v2/base-image:
    get:
      tags: [ base-image ]
      operationId: getBaseImages
      x-spring-paginated: true
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
        - in: query
          required: false
          name: type
          schema:
            $ref: '#/components/schemas/BaseImageType'
        - in: query
          required: false
          name: language
          schema:
            type: string
        - in: query
          required: false
          name: buildTool
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseImageResponse'
    post:
      tags: [ base-image ]
      operationId: createBaseImages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseImageRequest'
      responses:
        201:
          description: Created
  /v2/base-image/{id}:
    get:
      tags: [ base-image ]
      operationId: getBaseImage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseImageDetails'
    patch:
      tags: [ base-image ]
      operationId: updateBaseImages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseImageRequest'
      responses:
        201:
          description: Created
    delete:
      tags: [ base-image ]
      operationId: deleteBaseImages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        201:
          description: Created

  /v2/base-image/languages:
    get:
      tags: [ base-image ]
      operationId: getBaseImageLanguages
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v2/base-image/language/{name}/versions:
    get:
      tags: [ base-image ]
      operationId: getBaseImageLanguageVersions
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v2/base-image/build-tools:
    get:
      tags: [ base-image ]
      operationId: getBaseImageBuildTools
      parameters:
        - in: query
          name: language
          required: false
          schema:
            type: string
        - in: query
          name: version
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v2/base-image/build-tool/{name}/versions:
    get:
      tags: [ base-image ]
      operationId: getBaseImageBuildToolVersions
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v2/base-image/build-arguments:
    get:
      tags: [ base-image ]
      operationId: getBaseImageBuildArguments
      parameters:
        - in: query
          name: type
          required: true
          schema:
            $ref: '#/components/schemas/BaseImageType'
        - in: query
          name: language
          required: true
          schema:
            type: string
        - in: query
          name: languageVersion
          required: true
          schema:
            type: string
        - in: query
          name: buildTool.name
          required: false
          schema:
            type: string
        - in: query
          name: buildTool.version
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseImageArgumentResponse'

  /v2/images:
    get:
      tags: [ image ]
      operationId: getImages
      x-spring-paginated: true
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesResponse'
    post:
      operationId: createImage
      tags: [ image ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
  /v2/images/{id}:
    get:
      operationId: getImage
      tags: [ image ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetails'
          description: OK
    patch:
      operationId: editImage
      tags: [ image ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUpdateRequest'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
          description: OK
    delete:
      operationId: deleteImage
      tags: [ image ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: No content
  /v2/images/{id}/log:
    get:
      operationId: getImageLog
      tags: [ image ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageLog'
          description: ok
  /v2/images/tag/{id}:
    delete:
      operationId: deleteImageTag
      tags: [ image ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: No content

  /v2/groups:
    get:
      tags: [ group ]
      operationId: getAllGroups
      description: Get all user groups
      x-spring-paginated: true
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponse'
    post:
      tags: [ group ]
      operationId: createGroup
      description: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /v2/groups/{id}:
    delete:
      tags: [ group ]
      operationId: deleteGroup
      description: Delete a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: ok
        404:
          description: Not found
    patch:
      tags: [ group ]
      operationId: updateGroup
      description: Update a group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateRequest'
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        404:
          description: Not found

  /v2/deployments/{uid}/logs:
    get:
      tags: [ deployment ]
      operationId: triggerDeploymentLogs
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      responses:
        204:
          description: No content

  /v2/deployments:
    get:
      tags: [ deployment ]
      operationId: getDeployments
      x-spring-paginated: true
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
        - in: query
          name: group
          required: false
          schema:
            type: string
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentsResponse'
    post:
      tags: [ deployment ]
      operationId: createDeployment
      description: Deploy a new application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateRequest'
      responses:
        200:
          description: ok
  /v2/deployments/{id}:
    get:
      tags: [ deployment ]
      operationId: getDeployment
      description: get a deployment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentDetails'
    delete:
      tags: [ deployment ]
      operationId: deleteDeployment
      description: Delete a deployment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: No content
        404:
          description: Not found
    put:
      tags: [ deployment ]
      operationId: updateDeployment
      description: Update a deployment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateRequest'
      responses:
        200:
          description: ok
        404:
          description: Not found
  /v2/deployments/{id}/state:
    patch:
      tags: [ deployment ]
      operationId: updateDeploymentState
      description: Update a deployment state
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentState'
      responses:
        204:
          description: No content
        404:
          description: Not found

  /v2/storage:
    get:
      operationId: getStoredResources
      tags: [ storage ]
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
        - in: query
          name: name
          required: false
          schema:
            type: string
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageResponse"
  /v2/storage/resource:
    get:
      operationId: getStoredResource
      tags: [ storage ]
      description: Get stored resources by path, path can be provided either as a query param or as part of the url after the defined prefix
      parameters:
        - in: query
          name: path
          required: false
          schema:
            type: string
      responses:
        200:
          description: ok
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    delete:
      operationId: deleteStoredResource
      tags: [ storage ]
      description: Delete stored resource by path, path can be provided either as a query param or as part of the url after the defined prefix
      parameters:
        - in: query
          name: path
          required: false
          schema:
            type: string
      responses:
        204:
          description: No content

  /v2/registry/images:
    get:
      tags: [ registry ]
      operationId: getRegistryImages
      x-spring-paginated: true
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
        - name: user
          in: query
          required: false
          schema:
            type: string
        - name: app
          in: query
          required: false
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesResponse'
  /v2/registry/images/{id}:
    get:
      operationId: getRegistryImage
      tags: [ registry ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetails'
          description: OK
    delete:
      operationId: deleteRegistryImage
      tags: [ registry ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: No content
  /v2/registry/images/{id}/log:
    get:
      operationId: getRegistryImageLog
      tags: [ registry ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageLog'
          description: ok
  /v2/registry/images/tag/{id}:
    delete:
      operationId: deleteRegistryImageTag
      tags: [ registry ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: No content

components:
  parameters:
    pageParam:
      in: query
      name: page
      schema:
        type: integer
      description: Zero-based page index (0..N)
    sizeParam:
      in: query
      name: size
      schema:
        type: integer
      description: The size of the page to be returned
    sortParam:
      in: query
      name: sort
      schema:
        type: array
        items:
          type: string
      description: >-
        Sorting criteria in the format: property,(asc|desc).
        Default sort order is ascending.
        Multiple sort criteria are supported.
  schemas:
    BaseImageArgumentResponse:
      type: object
      properties:
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/BaseImageArgument'
    DeploymentCreateRequest:
      type: object
      required: [ groupId, deployment, service ]
      properties:
        groupId:
          type: integer
          description: group id
        deployment:
          type: object
          required: [ name, state, exposedPort, imageTagId, environment ]
          properties:
            name:
              type: string
            state:
              $ref: '#/components/schemas/DeploymentState'
            exposedPort:
              type: integer
            imageTagId:
              type: integer
            environment:
              type: object
              additionalProperties:
                type: string
        service:
          type: object
          required: [ name, port ]
          properties:
            name:
              type: string
        ingress:
          type: object
          required: [ name, path ]
          properties:
            name:
              type: string
            path:
              type: string
    DeploymentsResponse:
      type: object
      required: [ data, metadata ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    DeploymentDetails:
      type: object
      required: [ id, uid, general, service, environment, group, imageTag ]
      properties:
        id:
          type: integer
        uid:
          type: string
        general:
          type: object
          required: [ name, port ]
          properties:
            name:
              type: string
            port:
              type: integer
        ingress:
          type: object
          required: [ name, path ]
          properties:
            name:
              type: string
            path:
              type: string
        service:
          type: object
          required: [ name ]
          properties:
            name:
              type: string
        group:
          $ref: '#/components/schemas/Group'
        imageTag:
          $ref: '#/components/schemas/ImageTag'
        environment:
          type: object
          additionalProperties:
            type: string
    Deployment:
      type: object
      required: [ id, uid, name, image, cluster, service ]
      properties:
        id:
          type: integer
        uid:
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/DeploymentState'
        cluster:
          type: object
          required: [ url, namespace ]
          properties:
            url:
              type: string
            namespace:
              type: string
        group:
          type: object
          required: [ id, name ]
          properties:
            id:
              type: integer
            name:
              type: string
        image:
          type: object
          required: [ id, name, version, tag ]
          properties:
            id:
              type: integer
            name:
              type: string
            tag:
              type: object
              required: [ id, version ]
              properties:
                id:
                  type: integer
                version:
                  type: string
        service:
          type: object
          required: [ id. name, port ]
          properties:
            id:
              type: integer
            name:
              type: string
            port:
              type: integer
        ingress:
          type: object
          required: [ id, path ]
          properties:
            id:
              type: integer
            path:
              type: string
    DeploymentState:
      type: string
      enum:
        - INITIAL
        - STARTED
        - STOPPED
        - FAILED
    GroupCreateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
    GroupUpdateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
    GroupsResponse:
      type: object
      required: [ data, metadata ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    Group:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: integer
        name:
          type: string
    Namespace:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
    ImageCreateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
    ImageUpdateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
    ImagesResponse:
      type: object
      required: [ data, metadata ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    BaseImageResponse:
      type: object
      required: [ data, metadata ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BaseImage'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    Image:
      type: object
      required: [ id, name, releases ]
      properties:
        id:
          type: integer
        name:
          type: string
        user:
          $ref: '#/components/schemas/User'
        latest:
          $ref: '#/components/schemas/ImageTag'
        releases:
          type: integer
    User:
      type: object
      required: [ uid ]
      properties:
        uid:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        namespace:
          type: string
    ImageTag:
      type: object
      required: [ id, uid, version, created, status ]
      properties:
        id:
          type: integer
        uid:
          type: string
        version:
          type: string
        created:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ImageTagStatus'
    ImageLog:
      type: object
      required: [ data ]
      properties:
        data:
          type: string
    ImageTagStatus:
      type: string
      enum:
        - INITIALIZED
        - STARTED
        - FAILED
        - COMPLETED
    ImageDetails:
      type: object
      allOf:
        - $ref: '#/components/schemas/Image'
        - type: object
          required: [ tags ]
          properties:
            tags:
              type: array
              items:
                $ref: '#/components/schemas/ImageTagDetails'
    ImageTagDetails:
      type: object
      allOf:
        - $ref: '#/components/schemas/ImageTag'
        - type: object
          required: [ arguments, base ]
          properties:
            arguments:
              type: object
              additionalProperties: true
            base:
              $ref: '#/components/schemas/BaseImage'
    BaseImageType:
      type: string
      enum:
        - GIT
        - EXE
    BaseImageRequest:
      type: object
      required: [ value, type, arguments ]
      properties:
        baseImageId:
          type: integer
        baseImage:
          type: object
          required: [ language, version ]
          properties:
            language:
              type: string
            version:
              type: string
        type:
          $ref: '#/components/schemas/BaseImageType'
        value:
          type: string
        git:
          type: object
          required: [ buildTool, buildToolVersion ]
          properties:
            buildTool:
              type: string
            buildToolVersion:
              type: string
        exe:
          type: object
          required: [ fileType ]
          properties:
            fileType:
              type: string
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/BaseImageArgument'
    BaseImageUpdateRequest:
      type: object
      required: [ value, type, arguments ]
      properties:
        type:
          $ref: '#/components/schemas/BaseImageType'
        value:
          type: string
        git:
          type: object
          required: [ buildTool, buildToolVersion ]
          properties:
            buildTool:
              type: string
            buildToolVersion:
              type: string
        exe:
          type: object
          required: [ fileType ]
          properties:
            fileType:
              type: string
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/BaseImageArgument'
    BaseImage:
      type: object
      required: [ id, type, arguments, language ]
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/BaseImageType'
        language:
          type: string
        version:
          type: string
        exe:
          type: object
          required: [ fileType ]
          properties:
            fileType:
              type: string
        git:
          type: object
          required: [ buildTool, buildToolVersion ]
          properties:
            buildTool:
              type: string
            buildToolVersion:
              type: string
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/BaseImageArgument'
    BaseImageDetails:
      type: object
      required: [ base, value, baseImageId ]
      properties:
        baseImageId:
          type: integer
        base:
          $ref: '#/components/schemas/BaseImage'
        value:
          type: string
    BaseImageArgument:
      type: object
      required: [ name, description, type, stage ]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/BaseArgumentType'
        stage:
          $ref: '#/components/schemas/BaseArgumentStage'
    BaseArgumentType:
      type: string
      enum:
        - STRING
        - FILE
    BaseArgumentStage:
      type: string
      enum:
        - RUNTIME
        - BUILD
    ResponseMetadata:
      type: object
      required: [ pagination ]
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required: [ page, size, totalPages, totalElements ]
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 10
        totalElements:
          type: integer
          example: 200
    Sort:
      type: object
      format: sort
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    Pageable:
      type: object
      format: pageable
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        sort:
          type: array
          items:
            type: string
    StorageResponse:
      type: object
      required: [ data, metadata ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StoredResource"
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    StoredResource:
      type: object
      required: [ name, href, directory, contentType, contentLength, path— ]
      properties:
        name:
          type: string
        displayName:
          type: string
        path:
          type: string
        href:
          type: string
        directory:
          type: boolean
        etag:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64




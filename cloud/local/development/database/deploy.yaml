apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: database
  labels:
    app: database
spec:
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      securityContext:
        runAsUser: 1763188194 # machine user id
        fsGroup: 70
      containers:
        - name: database-container
          image: postgres:16.3-alpine3.20
          ports:
            - name: db-port
              containerPort: 5433
          env:
            - name: PGDATA
              value: '/var/lib/postgresql/db/data'
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: database-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: database-secret
            - name: POSTGRES_DB
              value: seaport_app
          volumeMounts:
            - mountPath: "/var/lib/postgresql/db"
              name: pg-data
            - mountPath: "docker-entrypoint-initdb.d"
              name: pg-data
              subPath: "scripts"

      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: database-data-pvc


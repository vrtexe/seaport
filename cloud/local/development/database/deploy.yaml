apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: database
  labels:
    app: database
spec:
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database-container
          image: postgres:16.3-alpine3.20
          ports:
            - name: db-port
              containerPort: 5433
          env:
            - name: PGDATA
              value: '/var/lib/postgresql/data/pg'
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: database-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: database-secret
            - name: POSTGRES_DB
              value: seaport_app
